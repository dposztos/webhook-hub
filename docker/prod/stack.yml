# Portainer stack for Webhook Hub.
#
# Same services as the root docker-compose.yml, but with the environment values
# supplied by Portainer's stack editor rather than an .env file. Set every
# ${VARIABLE} below under "Environment variables" when you deploy the stack.
services:
  app:
    image: ghcr.io/dposztos/webhook-hub:latest
    container_name: webhook-hub
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT}:80"
    environment:
      APP_NAME: "Webhook Hub"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_LOCALE: ${APP_LOCALE}

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      # Must be "true" behind HTTPS. Over plain HTTP the browser drops the
      # session cookie and you will not be able to log in.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE}
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # STARTTLS on port 587 wants scheme "smtp"; use "smtps" only for port 465.
      MAIL_SCHEME: ${MAIL_SCHEME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      WEBHOOK_MAX_BODY_BYTES: "524288"
      WEBHOOK_INGEST_RATE_LIMIT: "600"

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: webhook-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - webhook-hub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  webhook-hub-db:
