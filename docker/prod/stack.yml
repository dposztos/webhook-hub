# Portainer stack for Webhook Hub.
#
# Same services as the root docker-compose.yml, but with the environment values
# supplied by Portainer's stack editor rather than an .env file. Set every
# ${VARIABLE} below under "Environment variables" when you deploy the stack.
services:
  app:
    # Swap in your own webhook-hub:db2 build (docker/prod/Dockerfile.db2) for
    # Python scripts that need the IBM i (AS/400) ODBC driver.
    image: ${APP_IMAGE}
    container_name: webhook-hub
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT}:80"
    environment:
      APP_NAME: "Webhook Hub"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_LOCALE: ${APP_LOCALE}

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      # Must be "true" behind HTTPS. Over plain HTTP the browser drops the
      # session cookie and you will not be able to log in.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE}
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # STARTTLS on port 587 wants scheme "smtp"; use "smtps" only for port 465.
      MAIL_SCHEME: ${MAIL_SCHEME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      WEBHOOK_MAX_BODY_BYTES: "524288"
      WEBHOOK_INGEST_RATE_LIMIT: "600"

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Script actions: off unless you turn them on. See docs/scripts.md.
      WEBHOOK_SCRIPTS_ENABLED: ${WEBHOOK_SCRIPTS_ENABLED}
      WEBHOOK_SCRIPTS_ALLOW_INLINE: ${WEBHOOK_SCRIPTS_ALLOW_INLINE}
      WEBHOOK_SCRIPTS_DIR: /app/scripts
      WEBHOOK_PYTHON_BIN: /usr/bin/python3
      WEBHOOK_SCRIPT_TIMEOUT: ${WEBHOOK_SCRIPT_TIMEOUT}
      WEBHOOK_SCRIPT_MAX_TIMEOUT: ${WEBHOOK_SCRIPT_MAX_TIMEOUT}

      # Db2 for i (AS/400) credentials for script actions. They live here rather
      # than in a rule, so nobody has to paste a password into the UI. Needs the
      # DB2-capable image — see docs/as400.md.
      AS400_HOST: ${AS400_HOST}
      AS400_USER: ${AS400_USER}
      AS400_PASSWORD: ${AS400_PASSWORD}
      AS400_LIBRARIES: ${AS400_LIBRARIES}
      AS400_NAMING: ${AS400_NAMING}
      AS400_COMMIT: ${AS400_COMMIT}
    volumes:
      # Host folder holding the .py files the rules may run, read-only.
      - ${WEBHOOK_SCRIPTS_HOST_DIR}:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: webhook-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - webhook-hub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  webhook-hub-db:
