user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    # Webhook bodies can be large; the app is what caps what gets stored.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        root /app/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Must come after the include, which is where Debian's copy sets
            # HTTP_HOST to $host — the hostname without the port. The app then
            # builds every redirect without the published port, so a container
            # on :8080 sends the browser to :80. Alpine's copy does not do this,
            # which is why the two images behaved differently. $http_host is the
            # client's Host header, port included; nginx 1.30 will offer
            # "$host$is_request_port$request_port" as the careful version.
            fastcgi_param HTTP_HOST $http_host;

            fastcgi_read_timeout 60;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
