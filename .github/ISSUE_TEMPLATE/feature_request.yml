name: Idea or feature request
description: Suggest something the tool should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The situation rather than the solution — it often turns out there is an
        easier way to get there, or a more general feature that also covers it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
    validations:
      required: false
