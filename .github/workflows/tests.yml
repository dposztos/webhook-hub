name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    # The schema uses jsonb and a GIN index, so the suite runs on real Postgres
    # rather than SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webhookhub_test
          POSTGRES_USER: webhookhub
          POSTGRES_PASSWORD: webhookhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhookhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Prepared before composer install, because install runs Laravel's
      # post-autoload-dump hook, which boots the application.
      - name: Prepare the environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        # Unauthenticated downloads from codeload.github.com get rate-limited
        # (HTTP 429), which fails the install with exit code 100. The token
        # raises the limit and is scoped to this run.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate the application key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: webhookhub_test
          DB_USERNAME: webhookhub
          DB_PASSWORD: webhookhub
        run: php artisan test

      - name: Check code style
        run: ./vendor/bin/pint --test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
