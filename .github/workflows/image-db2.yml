# The DB2 variant of the image: Debian, Python, unixODBC and the IBM i Access
# ODBC driver, for script actions that query Db2 for i (docs/as400.md).
#
# Deliberately separate from image.yml, and deliberately never tagged "latest":
# this variant is heavier, amd64-only (IBM ships no arm64 driver), and is meant
# to be picked on purpose rather than pulled by accident.
name: Container image (DB2)

on:
  push:
    branches: [script-actions]
  workflow_dispatch:

concurrency:
  group: image-db2-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish
    # amd64 only: the IBM i Access ODBC driver has no arm64 build, so an arm64
    # image would carry everything except the reason this variant exists.
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Same conditional as image.yml: an unset secret would otherwise leave
          # a blank line in this list and fail the run.
          images: |
            ${{ env.REGISTRY_IMAGE }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/webhook-hub,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # latest=false matters: without it metadata-action adds "latest" on
          # its own, and this variant must never claim that tag.
          flavor: latest=false
          tags: |
            type=raw,value=db2
            type=raw,value=db2-{{date 'YYYYMMDD'}}
            type=sha,prefix=db2-sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile.db2
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=db2
          cache-to: type=gha,mode=max,scope=db2

      # The driver is the whole point of this image, so prove it is in there
      # rather than trusting that the build step would have failed.
      - name: Check the driver in the published image
        run: |
          docker run --rm --entrypoint bash "${REGISTRY_IMAGE}:db2" -lc '
            set -e
            python3 -V
            odbcinst -q -d | grep -q "IBM i Access ODBC Driver"
            python3 -c "import pyodbc; assert any(\"IBM i Access\" in d for d in pyodbc.drivers())"
            echo "driver and pyodbc present"
          '

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:db2"
