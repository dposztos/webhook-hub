# The DB2 variant of the image: Debian, Python, unixODBC and the IBM i Access
# ODBC driver, for script actions that query Db2 for i (docs/as400.md).
#
# Deliberately separate from image.yml, and deliberately never tagged "latest":
# this variant is heavier, amd64-only (IBM ships no arm64 driver), and is meant
# to be picked on purpose rather than pulled by accident.
name: Container image (DB2)

on:
  push:
    branches: [script-actions]
    # Prose and the compose file are not in the image; rebuilding for them
    # would only re-tag an identical build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docker/prod/compose.db2.yml'
      # A template for downstream images; nothing in this one depends on it.
      - 'docker/prod/Dockerfile.scripts'
  workflow_dispatch:

concurrency:
  group: image-db2-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish
    # amd64 only: the IBM i Access ODBC driver has no arm64 build, so an arm64
    # image would carry everything except the reason this variant exists.
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    services:
      # For the boot check below: the image runs its migrations on start, so it
      # needs a real Postgres to come up at all.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webhookhub
          POSTGRES_USER: webhookhub
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhookhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Same conditional as image.yml: an unset secret would otherwise leave
          # a blank line in this list and fail the run.
          images: |
            ${{ env.REGISTRY_IMAGE }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/webhook-hub,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # latest=false matters: without it metadata-action adds "latest" on
          # its own, and this variant must never claim that tag.
          flavor: latest=false
          tags: |
            type=raw,value=db2
            type=raw,value=db2-{{date 'YYYYMMDD'}}
            type=sha,prefix=db2-sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile.db2
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=db2
          cache-to: type=gha,mode=max,scope=db2

      # The driver is the whole point of this image, so prove it is in there
      # rather than trusting that the build step would have failed.
      - name: Check the driver in the published image
        run: |
          docker run --rm --entrypoint bash "${REGISTRY_IMAGE}:db2" -lc '
            set -e
            python3 -V
            odbcinst -q -d | grep -q "IBM i Access ODBC Driver"
            python3 -c "import pyodbc; assert any(\"IBM i Access\" in d for d in pyodbc.drivers())"
            echo "driver and pyodbc present"
          '

      # Start the published image for real and look at what it serves. The
      # driver check above would not have caught the bug this exists for: a
      # Debian nginx that rewrites HTTP_HOST to the port-less host, so every
      # redirect leaves the published port behind and lands on :80. That is
      # invisible in a unit test and invisible in the Alpine image.
      - name: Boot the published image and check its redirects
        run: |
          docker run -d --name hub -p 8099:80 \
            --add-host=host.docker.internal:host-gateway \
            -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64 -w0)" \
            -e APP_URL=http://127.0.0.1:8099 \
            -e DB_CONNECTION=pgsql -e DB_HOST=host.docker.internal -e DB_PORT=5432 \
            -e DB_DATABASE=webhookhub -e DB_USERNAME=webhookhub -e DB_PASSWORD=ci-only \
            -e SESSION_DRIVER=database -e QUEUE_CONNECTION=database -e CACHE_STORE=database \
            "${REGISTRY_IMAGE}:db2"

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/login && break
            sleep 2
          done

          location=$(curl -sSI http://127.0.0.1:8099/ | tr -d '\r' | awk '/^[Ll]ocation:/ {print $2}')
          echo "Location: $location"
          docker logs hub 2>&1 | tail -20

          case "$location" in
            http://127.0.0.1:8099/login) echo "the published port survives the redirect" ;;
            *) echo "redirect dropped the port: $location" >&2; exit 1 ;;
          esac

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:db2"
